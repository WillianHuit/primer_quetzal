<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Banco de piezas — Mi Primer Quetzal</title>
<link rel="stylesheet" href="../css/estilo.css">
<style>
  body { background: #eef1ef; font: 13px system-ui; padding: 10px; }
  .fila { display: flex; gap: 18px; margin-bottom: 26px; }
  .celda { text-align: center; }
  .escena { width: 190px; height: 150px; perspective: 700px; position: relative; }
  .suelo {
    position: absolute; left: 50%; top: 50%;
    width: 150px; height: 150px; margin: -75px 0 0 -75px;
    background: #d8ccb6;
    transform-style: preserve-3d;
    transform: rotateX(52deg) rotateZ(var(--v, 0deg));
  }
</style>
</head>
<body>
<!--
  BANCO DE PIEZAS. Las cajas del tablero —las casas del barrio y lo que se para
  en cada casilla— vistas solas y en las cuatro orientaciones del tablero.

  Existe porque una pieza mal hecha no se ve en el juego: a treinta pixeles y
  entre otras treinta, una caja sin paredes parece un cubo pequeno. Aqui se ve
  grande y girada, que es donde se nota. Asi salio que las cajas tenian tres
  caras y solo servian vistas desde una esquina.

  Se abre con doble clic, como todo. No carga el juego: copia el markup de
  `caja3d` (js/ui.js), asi que si esa funcion cambia, hay que cambiarlo aqui.
-->
<div id="salida"></div>
<script>
  var PIEZAS = [
    { n: 'casa 2 pisos', w: 34, d: 24, h: 28, c: '#f4eee2', t: '#c2603d', v: 1, cl: 'pieza-casa' },
    { n: 'edificio', w: 30, d: 24, h: 42, c: '#e2e9ee', t: '#93a6b3', v: 1, cl: 'pieza-edificio' },
    { n: 'tienda', w: 34, d: 22, h: 16, c: '#f7f0e3', t: '#2f8a6a', v: 0, toldo: 1, cl: 'pieza-tienda' },
    { n: 'lamina', w: 30, d: 22, h: 14, c: '#b7ada0', t: '#8d9aa1', v: 0, puerta: 1, cl: 'pieza-lamina' },
    { n: 'objeto de casilla', w: 16, d: 11, h: 14, c: '#e9c974', t: '#f4dfa4', v: 0, cl: 'obj' }
  ];
  function caja(p) {
    var est = 'width:' + p.w + 'px;height:' + p.d + 'px;--alto:' + p.h + 'px;--d:' + p.d + 'px;' +
              '--cara:' + p.c + ';--techo:' + p.t + ';left:50%;top:66%;' +
              'margin-left:' + (-p.w / 2) + 'px;margin-top:' + (-p.d) + 'px;';
    var pared = 'cara pared' + (p.v ? ' con-ventanas' : '');
    var dentro = p.toldo ? '<span class="toldo"></span>' : (p.puerta ? '<span class="puerta"></span>' : '');
    return '<span class="caja3d consombra ' + (p.cl || '') + '" style="' + est + '">' +
      '<span class="cara techo"></span>' +
      '<span class="' + pared + ' norte"></span>' +
      '<span class="' + pared + ' este"></span>' +
      '<span class="' + pared + ' oeste"></span>' +
      '<span class="' + pared + ' sur">' + dentro + '</span>' +
      '</span>';
  }
  var h = '';
  PIEZAS.forEach(function (p) {
    h += '<div class="fila">';
    [0, 90, 180, 270].forEach(function (v) {
      h += '<div class="celda"><div class="escena"><div class="suelo" style="--v:' + v + 'deg">' +
           caja(p) + '</div></div>' + p.n + ' · ' + v + '°</div>';
    });
    h += '</div>';
  });
  document.getElementById('salida').innerHTML = h;
</script>
</body>
</html>
